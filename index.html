<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Timemark</title>
<style>
  :root { color-scheme: dark; }
  body { margin:0; background:#111; color:#eee; font:16px -apple-system,system-ui,sans-serif;
         padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 16px); }
  h1 { font-size:20px; margin:16px 0; }
  label { display:block; margin:12px 0 4px; font-size:13px; color:#999; }
  input, button, textarea { width:100%; box-sizing:border-box; font:inherit; border-radius:10px;
         border:1px solid #333; background:#1c1c1e; color:#eee; padding:10px; }
  button { background:#F5B324; color:#000; font-weight:600; border:none; padding:14px; margin-top:16px; }
  button:disabled { opacity:.4; }
  #out { width:100%; margin-top:16px; border-radius:8px; display:none; }
  .hint { font-size:12px; color:#777; margin-top:8px; }
</style>
</head>
<body>
<h1>Timemark</h1>

<label>Ảnh</label>
<input type="file" id="file" accept="image/*">

<label>Thời gian</label>
<input type="datetime-local" id="when">

<label>Địa điểm</label>
<textarea id="place" rows="2">139 Nguyễn Cơ Thạch, Thành Phố Hồ Chí Minh, P. An Khánh</textarea>

<button id="save" disabled>Lưu ảnh</button>
<p class="hint">Nếu không hiện bảng chia sẻ: nhấn giữ ảnh bên dưới → "Lưu vào Ảnh".</p>

<img id="out" alt="">

<script>
const YELLOW = '#F5B324';
const DAYS = ['Chủ Nhật','Thứ Hai','Thứ Ba','Thứ Tư','Thứ Năm','Thứ Sáu','Thứ Bảy'];

// Time face identified by measuring the original screenshot: digit ink/height 0.43
// and a proportional '1' (advance 0.62x the other digits) rule out Roboto Condensed,
// whose figures are tabular. Pathway Gothic One matches on every metric.
const TIME = px => `400 ${px}px "Pathway Gothic One", "Helvetica Neue", Arial, sans-serif`;
const BODY = (px, w = 400) => `${w} ${px}px Roboto, -apple-system, "Helvetica Neue", Arial, sans-serif`;

const LATIN = 'U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD';
const VIET  = 'U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB';

// Self-hosted + registered via FontFace, not a CSS <link>: WebKit will silently
// fall back to sans-serif on canvas for fonts it only knows from a stylesheet.
// Roboto ships as one variable file covering 100-900, hence the shared weight range.
const fontsReady = Promise.all([
  ['Pathway Gothic One', 'fonts/pathway-latin.woff2', '400',     LATIN],
  ['Roboto',             'fonts/r-latin.woff2',       '100 900', LATIN],
  ['Roboto',             'fonts/r-viet.woff2',        '100 900', VIET ],
].map(([family, url, weight, unicodeRange]) =>
  new FontFace(family, `url(${url})`, { weight, unicodeRange })
    .load().then(f => document.fonts.add(f))
)).catch(e => console.error('font load failed', e));

const two = n => String(n).padStart(2, '0');
const fmtTime = d => two(d.getHours()) + ':' + two(d.getMinutes());
const fmtDate = d => `${d.getDate()} Tháng ${d.getMonth() + 1}, ${d.getFullYear()}`;
const fmtDay  = d => DAYS[d.getDay()];

// ponytail: greedy wrap, no hyphenation. Good enough for addresses.
function wrap(ctx, text, maxW) {
  const lines = [];
  let line = '';
  for (const word of text.split(/\s+/)) {
    const test = line ? line + ' ' + word : word;
    if (line && ctx.measureText(test).width > maxW) { lines.push(line); line = word; }
    else line = test;
  }
  if (line) lines.push(line);
  return lines;
}

// Random watermark ID, same shape as real Timemark stamps.
const CODE = Array.from({length:13}, () =>
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'[Math.floor(Math.random()*36)]).join('');

function render(bitmap, date, place) {
  const W = bitmap.width, H = bitmap.height, s = W / 960;
  const c = document.createElement('canvas');
  c.width = W; c.height = H;
  const ctx = c.getContext('2d');
  ctx.drawImage(bitmap, 0, 0);

  ctx.textBaseline = 'alphabetic';
  ctx.shadowColor = 'rgba(0,0,0,.55)';
  ctx.shadowBlur = 6 * s;

  // Big time. Size 124 puts digit ink at 87px tall, matching the original.
  ctx.fillStyle = '#fff';
  ctx.font = TIME(124 * s);
  const timeEnd = 28 * s + ctx.measureText(fmtTime(date)).width;
  ctx.fillText(fmtTime(date), 28 * s, H - 134 * s);

  // Yellow divider bar
  ctx.fillStyle = YELLOW;
  ctx.fillRect(timeEnd + 12 * s, H - 222 * s, 4 * s, 91 * s);

  // Date + weekday
  ctx.fillStyle = '#fff';
  ctx.font = BODY(33 * s);
  ctx.fillText(fmtDate(date), timeEnd + 35 * s, H - 197 * s);
  ctx.fillText(fmtDay(date),  timeEnd + 35 * s, H - 136 * s);

  // Address (wraps, 2 lines max)
  ctx.font = BODY(35 * s);
  wrap(ctx, place.trim(), W - 300 * s).slice(0, 2).forEach((line, i) => {
    ctx.fillText(line, 25 * s, H - 80 * s + i * 42 * s);
  });

  // Logo bottom-right
  ctx.textAlign = 'right';
  ctx.font = BODY(32 * s, 700);
  const markW = ctx.measureText('mark').width;
  ctx.fillText('mark', W - 13 * s, H - 46 * s);
  ctx.fillStyle = YELLOW;
  ctx.fillText('Time', W - 13 * s - markW, H - 46 * s);
  ctx.fillStyle = '#ccc';
  ctx.font = BODY(20 * s);
  ctx.fillText('100% Chân thực', W - 14 * s, H - 20 * s);

  // Vertical verified strip on right edge
  ctx.save();
  ctx.translate(W - 15 * s, H / 2);
  ctx.rotate(-Math.PI / 2);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = BODY(20 * s);
  ctx.fillText(`© ${CODE}  Timemark Verified`, 0, 0);
  ctx.restore();

  return c;
}

const $ = id => document.getElementById(id);
let bitmap = null;

$('when').value = new Date(Date.now() - new Date().getTimezoneOffset() * 6e4)
  .toISOString().slice(0, 16);

async function draw() {
  if (!bitmap) return;
  await fontsReady;
  const date = $('when').value ? new Date($('when').value) : new Date();
  const canvas = render(bitmap, date, $('place').value);
  canvas.toBlob(b => {
    $('out').src = URL.createObjectURL(b);
    $('out').style.display = 'block';
    $('save').disabled = false;
    $('save').onclick = async () => {
      const file = new File([b], 'timemark.jpg', { type: 'image/jpeg' });
      if (navigator.canShare?.({ files: [file] })) {
        try { await navigator.share({ files: [file] }); } catch {}
      } else {
        alert('Nhấn giữ ảnh bên dưới → Lưu vào Ảnh');
      }
    };
  }, 'image/jpeg', 0.92);
}

$('file').onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  // from-image: respects EXIF so library photos don't come out sideways.
  bitmap = await createImageBitmap(f, { imageOrientation: 'from-image' });
  draw();
};
$('when').oninput = draw;
$('place').oninput = draw;

// ponytail: one self-check for the non-trivial bits (date words + wrap). Open with #test.
if (location.hash === '#test') {
  const d = new Date(2026, 6, 21, 11, 54);
  console.assert(fmtTime(d) === '11:54', 'time', fmtTime(d));
  console.assert(fmtDate(d) === '21 Tháng 7, 2026', 'date', fmtDate(d));
  console.assert(fmtDay(d) === 'Thứ Ba', 'day', fmtDay(d));
  const ctx = document.createElement('canvas').getContext('2d');
  ctx.font = '20px sans-serif';
  console.assert(wrap(ctx, 'a b c', 1e6).length === 1, 'wrap one line');
  console.assert(wrap(ctx, 'aaaa bbbb cccc', 45).length >= 2, 'wrap splits');
  // fonts.check() is useless here: a font string with fallbacks reports true even
  // when the real face is missing. Measure instead — condensed must be narrower.
  fontsReady.then(() => {
    const m = (f, t) => { ctx.font = f; return ctx.measureText(t).width; };
    // Narrower than a default sans, and '1' must be proportional (narrower than '5').
    const narrow = m(TIME(100), '11:54') / m('400 100px sans-serif', '11:54');
    const prop = m(TIME(100), '11') / m(TIME(100), '55');
    const viet = m(BODY(100), 'Thứ') / m(BODY(100), 'Thu');
    console.assert(narrow < 0.75, 'Pathway Gothic One NOT applied, ratio=' + narrow);
    console.assert(prop < 0.8, "figures are tabular, wrong time font, ratio=" + prop);
    console.assert(viet > 1.0, 'Vietnamese glyphs missing (Thứ measured as Thu)');
    alert(`self-check — narrow ${narrow.toFixed(2)}<0.75, prop ${prop.toFixed(2)}<0.8, viet ${viet.toFixed(2)}>1`);
  });
}
</script>
</body>
</html>
